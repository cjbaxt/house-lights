name: Summarise new shows

on:
  workflow_run:
    workflows: ["Scrape & summarise"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summarise:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          cd backend
          pip install --force-reinstall -e ".[dev]" 2>/dev/null || pip install --force-reinstall -e .

      - name: Summarise new shows
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd backend
          python enrich_summaries.py
