name: Scrape & summarise

on:
  schedule:
    - cron: '0 6 * * 1'   # 6am UTC every Monday
  workflow_dispatch:        # manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]" 2>/dev/null || pip install -e .

      - name: Install Playwright browsers
        run: |
          cd backend
          python -m playwright install chromium --with-deps

      - name: Run scrapers
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URI }}
        run: |
          cd backend
          python run_scrapers.py

      - name: Enrich summaries (new shows only)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd backend
          python enrich_summaries.py

      - name: Enrich images (new shows only)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URI }}
        run: |
          cd backend
          python enrich_images.py 2>/dev/null || echo "enrich_images skipped"
