name: Scrape & summarise

on:
  schedule:
    - cron: '0 6 * * 1'   # 6am UTC every Monday
  workflow_dispatch:        # manual trigger from GitHub Actions tab

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          cd backend
          pip install --force-reinstall -e ".[dev]" 2>/dev/null || pip install --force-reinstall -e .

      - name: Install Playwright browsers
        run: |
          cd backend
          python -m playwright install chromium --with-deps

      - name: Run scrapers
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URI }}
        run: |
          cd backend
          python run_scrapers.py

      - name: Enrich images (new shows only)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URI }}
        run: |
          cd backend
          python enrich_images.py 2>/dev/null || echo "enrich_images skipped"
